<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fat Loss Quest</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#120F26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1EEFA; --panel:#FFFFFF; --panel2:#E7E2F6; --ink:#1D1736; --muted:#6A6390;
  --line:#D6CFEE; --gold:#A8740A; --goldbg:#FCEFC7; --hp:#1E9E5C; --hpbg:#D5F2E2;
  --ember:#D6402F; --emberbg:#FBDDD8; --accent:#5B3FD6; --tick:#1E9E5C; --tickInk:#FFFFFF;
  --tab:#FFFFFF;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#120F26; --panel:#1E1940; --panel2:#2A2356; --ink:#EDEAF8; --muted:#A29BC8;
    --line:#352D66; --gold:#F5C044; --goldbg:#3A2F12; --hp:#5BD08A; --hpbg:#173A2A;
    --ember:#FF7A66; --emberbg:#3D1D1D; --accent:#9C86FF; --tick:#5BD08A; --tickInk:#0E2A1B;
    --tab:#17132F; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#120F26; --panel:#1E1940; --panel2:#2A2356; --ink:#EDEAF8; --muted:#A29BC8;
  --line:#352D66; --gold:#F5C044; --goldbg:#3A2F12; --hp:#5BD08A; --hpbg:#173A2A;
  --ember:#FF7A66; --emberbg:#3D1D1D; --accent:#9C86FF; --tick:#5BD08A; --tickInk:#0E2A1B;
  --tab:#17132F; color-scheme: dark;
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Chakra Petch",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.pix{font-family:"Silkscreen","Courier New",monospace}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px 110px}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 14px 10px;max-width:560px;margin:0 auto}
.hudrow{display:flex;align-items:center;gap:12px}
.lvl{width:54px;height:54px;flex:none;border:3px solid var(--gold);border-radius:6px;display:grid;place-items:center;background:var(--goldbg);box-shadow:3px 3px 0 var(--gold)}
.lvl b{font-family:"Silkscreen",monospace;font-size:24px;line-height:1;color:var(--gold)}
.lvl small{display:block;font-size:9px;color:var(--gold);text-align:center;font-family:"Silkscreen",monospace;margin-top:-2px}
.who{flex:1;min-width:0}
.who .n{font-weight:700;font-size:17px}
.who .r{font-size:13px;color:var(--muted)}
.xpbar{height:12px;background:var(--panel2);border-radius:3px;margin-top:6px;overflow:hidden;border:1px solid var(--line)}
.xpbar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--gold) 0 8px,color-mix(in srgb,var(--gold) 80%,#fff) 8px 10px);transition:width .5s}
.xptxt{font-size:11px;color:var(--muted);margin-top:3px;display:flex;justify-content:space-between}

/* panels */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
h2{font-size:15px;margin:0 0 10px;font-weight:700}
h1.title{font-family:"Silkscreen",monospace;font-weight:400;font-size:22px;margin:8px 0 4px;letter-spacing:.5px}
.sub{color:var(--muted);font-size:13px;margin:0}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}

/* date nav */
.datenav{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.navbtn{width:42px;height:42px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:20px;display:grid;place-items:center}
.datenav .d{text-align:center}
.datenav .d b{display:block;font-size:18px}
.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:var(--panel2);color:var(--muted)}
.chip.go{background:var(--accent);color:#fff;border:0}

/* ring */
.today-top{display:flex;gap:16px;align-items:center}
.ring{width:110px;height:110px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font-family:"Silkscreen",monospace;font-size:24px;display:block;line-height:1}
.ring .c span{font-size:11px;color:var(--muted)}
.dayxp{font-family:"Silkscreen",monospace;font-size:28px;color:var(--gold);line-height:1}
.perfect{margin-top:8px;font-size:13px;padding:6px 10px;border-radius:6px;background:var(--goldbg);color:var(--gold);font-weight:600;display:inline-block}

/* quest list */
.q{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);margin:8px 0;text-align:left;transition:transform .08s}
.q:active{transform:scale(.98)}
.box{width:30px;height:30px;flex:none;border:2.5px solid var(--line);border-radius:6px;display:grid;place-items:center;font-weight:800;color:transparent;transition:background .15s,border-color .15s}
.q.on .box{background:var(--tick);border-color:var(--tick);color:var(--tickInk)}
.q.on{border-color:color-mix(in srgb,var(--tick) 55%,var(--line))}
.q .nm{flex:1;min-width:0;font-weight:600}
.q .nm small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.q .xp{font-family:"Silkscreen",monospace;font-size:13px;color:var(--gold);white-space:nowrap}
.q.on .nm{text-decoration:none}

/* inputs */
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.field label{font-size:12px;color:var(--muted)}
input[type=number],input[type=text],select{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:16px}
.btn{padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-weight:600}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.danger{color:var(--ember);border-color:var(--ember);background:transparent}

/* month grid */
.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);-webkit-overflow-scrolling:touch}
table.g{border-collapse:separate;border-spacing:0;font-size:12px}
table.g th,table.g td{padding:0;text-align:center}
table.g .hn{position:sticky;left:0;background:var(--panel);z-index:2;text-align:left;padding:4px 8px;min-width:132px;max-width:132px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--line);font-weight:600}
table.g thead th{padding:4px 0;color:var(--muted);font-weight:500;min-width:30px}
table.g thead th.today{color:var(--gold);font-weight:700}
table.g thead th .dn{display:block;font-size:13px;color:var(--ink)}
table.g thead th.today .dn{color:var(--gold)}
.cell{width:26px;height:26px;margin:2px;border-radius:5px;border:1.5px solid var(--line);background:transparent;display:grid;place-items:center;font-size:13px;color:transparent;padding:0}
.cell.on{background:var(--tick);border-color:var(--tick);color:var(--tickInk);font-weight:800}
.cell.fut{opacity:.4}
table.g tfoot td{font-size:11px;color:var(--muted);padding:3px 0}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel2);border-radius:8px;padding:10px}
.stat b{display:block;font-family:"Silkscreen",monospace;font-size:20px;line-height:1.1}
.stat span{font-size:11px;color:var(--muted)}

/* bosses */
.boss{display:flex;gap:12px;align-items:center;padding:12px;border-radius:10px;border:1px solid var(--line);margin:8px 0;background:var(--panel)}
.boss .ico{font-size:30px;width:44px;text-align:center}
.boss .bn{font-weight:700}
.hpbar{height:10px;background:var(--emberbg);border-radius:3px;overflow:hidden;margin-top:6px}
.hpbar i{display:block;height:100%;background:var(--ember)}
.boss.dead{background:var(--hpbg);border-color:color-mix(in srgb,var(--hp) 40%,var(--line))}
.boss.dead .bn{color:var(--hp)}
.boss .rw{font-family:"Silkscreen",monospace;font-size:12px;color:var(--gold);white-space:nowrap}
.journey{position:relative;height:16px;background:var(--panel2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.journey i{position:absolute;inset:0 auto 0 0;background:var(--hp)}
.big{font-family:"Silkscreen",monospace;font-size:26px;line-height:1}
table.lb{width:100%;border-collapse:collapse;font-size:14px}
table.lb td,table.lb th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}
table.lb td:first-child,table.lb th:first-child{text-align:left}
table.lb th{font-size:12px;color:var(--muted);font-weight:500}
.hot{color:var(--gold);font-weight:700}

/* PRs */
.pr{padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);margin:8px 0}
.pr .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pr .top b{font-size:15px}
.pr .base{font-size:12px;color:var(--muted)}
.pr .ins{display:flex;gap:8px;margin-top:8px;align-items:center}
.pr .ins input{padding:8px 10px}
.pr.won{border-color:var(--gold);background:var(--goldbg)}
.badge{font-size:12px;font-weight:700;color:var(--gold);white-space:nowrap}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--tab);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:9px 2px 10px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .e{font-size:20px;filter:grayscale(.7);opacity:.7}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:700}
nav.tabs button[aria-current="page"] .e{filter:none;opacity:1}

/* level up */
.lvlup{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:rgba(10,8,25,.72)}
.lvlup.show{display:grid}
.lvlup .box2{text-align:center;color:#fff;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.lvlup .box2 .t{font-family:"Silkscreen",monospace;font-size:34px;color:#F5C044;text-shadow:3px 3px 0 #7A4E00}
.lvlup .box2 .l{font-family:"Silkscreen",monospace;font-size:72px;line-height:1;margin:8px 0}
.lvlup .box2 p{margin:6px 0 18px;font-size:16px}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){.lvlup .box2{animation:none}.xpbar i{transition:none}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:15;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.sync{font-size:11px;color:var(--muted);text-align:center;margin-top:18px}
svg text{font-family:"Chakra Petch",sans-serif}
</style>
</head>
<body>
<header class="hud" id="hud"></header>
<main class="wrap" id="view"></main>
<nav class="tabs" aria-label="Sections"><div class="in" id="tabs"></div></nav>
<div class="lvlup" id="lvlup" role="dialog" aria-modal="true"><div class="box2"><div class="t">Level up!</div><div class="l" id="lvN">2</div><p id="lvR"></p><button class="btn primary" id="lvOk">Keep going</button></div></div>
<div class="toast" id="toast"></div>
<script>
(function(){
"use strict";
const LS_KEY="flq-state-v1";
const pad=n=>String(n).padStart(2,"0");
const keyOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fromKey=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const todayKey=()=>keyOf(new Date());
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt1=n=>(Math.round(n*10)/10).toFixed(1);
const DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];

function defaults(){
  return {
    v:1,qv:5,name:"Rohith",updatedAt:0,
    quests:[
      {id:"n0",name:"⚖️ Morning weigh-in",diff:"Easy"},
      {id:"n1",name:"🏋️ Gym (Sun = rest)",diff:"Hard"},
      {id:"n2",name:"🧼 Morning face wash",diff:"Easy"},
      {id:"n3",name:"🌸 Roll-on and scent",diff:"Easy"},
      {id:"n4",name:"🚶 Evening walk",diff:"Medium"},
      {id:"n5",name:"🎬 Upload to YouTube",diff:"Medium"},
      {id:"n7",name:"🌙 Night face wash",diff:"Easy"},
      {id:"n8",name:"🍽️ Calorie-controlled dinner",diff:"Medium"},
      {id:"n9",name:"📝 Calories tracked for the whole day",diff:"Hard"},
      {id:"n6",name:"🥤 No snacks (only Coke Zero)",diff:"Hard"},
      {id:"n10",name:"No 🚫",diff:"Hard"}
    ],
    diffXP:{Easy:10,Medium:20,Hard:30,Epic:50},
    rules:{xpPerLevel:500,perfectBonus:50,prXP:100,waistXP:20},
    body:{height:180.3,start:99.3,phase2:93.6,goal:75,kcal:1800,protein:140},
    bosses:[
      {name:"The 93 Gatekeeper",ico:"👹",target:93,xp:250},
      {name:"The 90 Dragon",ico:"🐉",target:90,xp:500},
      {name:"The 85 Golem",ico:"🗿",target:85,xp:750},
      {name:"The 80 Demon",ico:"👿",target:80,xp:1000},
      {name:"Final boss: 75",ico:"💀",target:75,xp:2000}
    ],
    ranks:[[1,"🥚 Rookie"],[5,"🏃 Grinder"],[10,"🔥 Fat Burner"],[20,"⚔️ Shredder"],[35,"🛡️ Iron Will"],[50,"🦾 Aesthetic Warrior"],[70,"👑 Shredded Legend"]],
    days:{"2026-10-26":{done:[],w:93.3},"2026-10-27":{done:[],w:93.3},"2026-10-28":{done:[],w:95.0},"2026-10-29":{done:[],w:93.8}},
    prs:[
      ["Flat DB press (per DB)","Chest ⭐",22.5,8],["Incline DB press (per DB)","Chest ⭐",20,8],["High-to-low chest fly","Chest ⭐",50,8],
      ["Pec deck","Chest",54,8],["Wide-grip lat pulldown","Back / V-taper ⭐",70,8],["Seated linear row","Back",50,10],
      ["One-arm high-to-low cable row","Back / V-taper",30,12],["Machine shoulder press","Delts",32,10],["Cable lateral raise","Delts / V-taper ⭐",5,15],
      ["Reverse pec deck","Rear delts",41,15],["Seated leg curl","Hamstrings ⭐",59,10],["Cable pull-through","Glutes / hams ⭐",35,15],
      ["Bulgarian split squat (per DB)","Legs",7.5,10],["Incline leg press","Quads (maintain)",200,10],["Seated calf raise","Calves",30,15],
      ["Wrist curl","Forearms ⭐",15,15],["Reverse wrist curl","Forearms ⭐",5,15]
    ].map((p,i)=>({id:"p"+i,name:p[0],focus:p[1],bkg:p[2],breps:p[3],kg:null,reps:null}))
  };
}

const QV=5;
function migrate(p){if(p.qv!==QV){if((p.qv>=2&&p.qv<=4)&&Array.isArray(p.quests)){if(!p.quests.some(q=>q.id==="n0"))p.quests.unshift({id:"n0",name:"⚖️ Morning weigh-in",diff:"Easy"});if(p.qv<4){const i=p.quests.findIndex(q=>q.id==="n6");if(i>=0){const q=p.quests.splice(i,1)[0];q.name=q.name.replace("🚫","🥤");p.quests.push(q)}}if(!p.quests.some(q=>q.id==="n10"))p.quests.push({id:"n10",name:"No 🚫",diff:"Hard"})}else p.quests=defaults().quests;p.qv=QV}return p}
let S=defaults();
try{const raw=localStorage.getItem(LS_KEY);if(raw){const p=JSON.parse(raw);if(p&&p.v===1)S=Object.assign(defaults(),migrate(p))}}catch(e){}

/* ---------- sync ---------- */
let dbRef=null, syncLabel="Saved on this device", dbTimer=null;
function save(){
  S.updatedAt=Date.now();
  try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}
  if(dbRef){clearTimeout(dbTimer);dbTimer=setTimeout(pushDb,700)}
}
async function pushDb(){
  if(!dbRef)return;
  try{await dbRef.set(JSON.parse(JSON.stringify(S)));setSync("Saved to your Claude account")}
  catch(e){
    if(e&&e.code==="unavailable"){setTimeout(pushDb,1500+Math.random()*1500);return}
    dbRef=null;setSync("Saved on this device only");
  }
}
function setSync(t){syncLabel=t;const el=document.getElementById("sync");if(el)el.textContent=t}
(async function initDb(){
  if(!window.claude||!window.claude.use)return;
  try{
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user)return;
    const uid=await user.id(); if(!uid)return;
    const ref=db.doc("data/users/"+uid+"/state");
    const snap=await ref.get();
    dbRef=ref;
    if(snap.exists){
      const remote=snap.data();
      if(remote&&remote.v===1&&(remote.updatedAt||0)>=(S.updatedAt||0)){
        S=Object.assign(defaults(),migrate(JSON.parse(JSON.stringify(remote))));
        try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}
        lastLevel=calc().level; render();
      } else await pushDb();
    } else await pushDb();
    setSync("Saved to your Claude account");
  }catch(e){dbRef=null}
})();

/* ---------- game maths ---------- */
const active=()=>S.quests.filter(q=>q.name.trim());
const qxp=q=>S.diffXP[q.diff]||0;
function rec(k){return S.days[k]||(S.days[k]={done:[]})}
function isDone(k,id){const r=S.days[k];return !!(r&&r.done&&r.done.includes(id))}
function dayInfo(k){
  const a=active(); const r=S.days[k];
  const done=r?a.filter(q=>r.done.includes(q.id)):[];
  let xp=done.reduce((s,q)=>s+qxp(q),0);
  const perfect=a.length>0&&done.length===a.length;
  if(perfect)xp+=S.rules.perfectBonus;
  return {done:done.length,total:a.length,xp,perfect,max:a.reduce((s,q)=>s+qxp(q),0)+S.rules.perfectBonus};
}
function weightSeries(){
  return Object.keys(S.days).filter(k=>typeof S.days[k].w==="number").sort().map(k=>({k,w:S.days[k].w}));
}
function avg7(k,ws){
  const end=fromKey(k), start=addDays(end,-6);
  const xs=ws.filter(p=>{const d=fromKey(p.k);return d>=start&&d<=end}).map(p=>p.w);
  return xs.length?xs.reduce((a,b)=>a+b,0)/xs.length:null;
}
function streaks(id){
  const keys=Object.keys(S.days).sort(); let best=0,run=0,prev=null;
  for(const k of keys){
    if(isDone(k,id)){run=(prev&&keyOf(addDays(fromKey(prev),1))===k&&isDone(prev,id))?run+1:1;best=Math.max(best,run)}
    prev=k;
  }
  let cur=0,d=new Date(); if(!isDone(keyOf(d),id))d=addDays(d,-1);
  while(isDone(keyOf(d),id)){cur++;d=addDays(d,-1)}
  const count=keys.filter(k=>isDone(k,id)).length;
  return {cur,best,count};
}
function prWon(p){return p.kg!=null&&p.kg!==""&&(+p.kg>p.bkg||(+p.kg===p.bkg&&+(p.reps||0)>p.breps))}
function calc(){
  const ws=weightSeries();
  const latest=ws.length?ws[ws.length-1].w:S.body.phase2;
  const avgs=ws.map(p=>avg7(p.k,ws));
  const latestAvg=avgs.length?avgs[avgs.length-1]:latest;
  const lowest=avgs.length?Math.min(...avgs):latest;
  let questXP=0,perfectDays=0;
  for(const k in S.days){const i=dayInfo(k);questXP+=i.xp;if(i.perfect)perfectDays++}
  const bossXP=S.bosses.filter(b=>lowest<=b.target).reduce((s,b)=>s+b.xp,0);
  const prXP=S.prs.filter(prWon).length*S.rules.prXP;
  const waistN=Object.values(S.days).filter(r=>typeof r.waist==="number").length;
  const waistXP=waistN*S.rules.waistXP;
  const total=questXP+bossXP+prXP+waistXP;
  const level=Math.floor(total/S.rules.xpPerLevel)+1;
  let rank=S.ranks[0][1]; for(const [l,t] of S.ranks) if(level>=l) rank=t;
  return {ws,latest,latestAvg,lowest,questXP,perfectDays,bossXP,prXP,waistXP,waistN,total,level,rank,
    into:total%S.rules.xpPerLevel};
}
let lastLevel=calc().level;

let tab=(location.hash||"").replace("#","")||"today";

const $=id=>document.getElementById(id);
function toast(t){const el=$("toast");el.textContent=t;el.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove("show"),1600)}

function renderHud(c){

}
function renderTabs(){

function ring(done,total){
  const r=46,C=2*Math.PI*r,p=total?done/total:0;
  return `<div class="ring"><svg width="110" height="110" viewBox="0 0 110 110" aria-hidden="true">
    <circle cx="55" cy="55" r="${r}" fill="none" stroke="var(--panel2)" stroke-width="10"/>
    <circle cx="55" cy="55" r="${r}" fill="none" stroke="${p===1?"var(--gold)":"var(--hp)"}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}" style="transition:stroke-dashoffset .4s"/>
  </svg><div class="c"><div><b>${done}/${total}</b><span>quests</span></div></div></div>`;
}

function viewToday(c){
  const d=fromKey(viewKey), isToday=viewKey===todayKey(), future=d>new Date();
  const info=dayInfo(viewKey); const r=S.days[viewKey]||{};
  const ws=c.ws; const a7=typeof r.w==="number"?avg7(viewKey,ws):null;
  const qs=active().map(q=>{const on=isDone(viewKey,q.id);const st=streaks(q.id);
    return `<button class="q ${on?"on":""}" data-q="${q.id}" aria-pressed="${on}"><span class="box">✓</span>
      <span class="nm">${esc(q.name)}<small>${st.cur>0?`🔥 ${st.cur}-day streak`:"Start a streak"}</small></span>
      <span class="xp">+${qxp(q)}</span></button>`}).join("");
  return `
  <div class="datenav"><button class="navbtn" data-day="-1" aria-label="Previous day">‹</button>
    <div class="d"><b>${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}</b>${isToday?'<span class="chip">Today</span>':'<button class="chip go" data-day="0">Back to today</button>'}</div>
    <button class="navbtn" data-day="1" aria-label="Next day">›</button></div>
  <div class="card today-top">${ring(info.done,info.total)}
    <div><div class="muted" style="font-size:13px">XP earned ${isToday?"today":"this day"}</div><div class="dayxp">${info.xp}</div>
    <div class="muted" style="font-size:12px;margin-top:4px">of ${info.max} possible</div>

    <p class="sub" style="margin-top:8px">${a7!=null?`7-day average: <b>${a7.toFixed(2)} kg</b>. That’s the number bosses look at, not one morning.`:"Weigh after the toilet, before food or water, same time each day."}</p>
  </div>`;
}

function viewMonth(){
  const y=monthCursor.getFullYear(),m=monthCursor.getMonth(); const nd=new Date(y,m+1,0).getDate();
  const tk=todayKey(), now=new Date(); const a=active();
  let head="",foot1="",foot2="",done=0,possible=0,perfect=0,xp=0; const pts=[];
  for(let i=1;i<=nd;i++){
    const d=new Date(y,m,i),k=keyOf(d),info=dayInfo(k),fut=d>now;
    head+=`<th class="${k===tk?"today":""}">${DAYS[d.getDay()].slice(0,2)}<span class="dn">${i}</span></th>`;
    foot1+=`<td>${fut?"":info.done}</td>`;
    foot2+=`<td>${fut?"":(info.perfect?"⭐":"")}</td>`;
    done+=info.done; xp+=info.xp; if(info.perfect)perfect++;
    if(!fut){possible+=info.total;pts.push(info.total?info.done/info.total:0)}
  }
  const rows=a.map(q=>{let cells="";for(let i=1;i<=nd;i++){const d=new Date(y,m,i),k=keyOf(d),on=isDone(k,q.id);
      cells+=`<td><button class="cell ${on?"on":""} ${d>now?"fut":""}" data-cell="${k}|${q.id}" aria-label="${esc(q.name)} on ${i} ${MONTHS[m]}" aria-pressed="${on}">✓</button></td>`}
    return `<tr><th class="hn" scope="row">${esc(q.name)}</th>${cells}</tr>`}).join("");
  const pct=possible?Math.round(done/possible*100):0;
  // chart
  const W=520,H=120,n=Math.max(pts.length,1);
  let path="";
  if(pts.length){const step=W/(nd-1||1);path=`M0,${H} `+pts.map((p,i)=>`L${(i*step).toFixed(1)},${(H-p*(H-10)).toFixed(1)}`).join(" ")+` L${((pts.length-1)*step).toFixed(1)},${H} Z`}
  return `
  <div class="datenav"><button class="navbtn" data-month="-1" aria-label="Previous month">‹</button>
    <div class="d"><b>${MONTHS[m]} ${y}</b><span class="chip">Quest log</span></div>
    <button class="navbtn" data-month="1" aria-label="Next month">›</button></div>
  <div class="stats3" style="margin-top:12px">
    <div class="stat"><b>${pct}%</b><span>completion so far</span></div>
    <div class="stat"><b>${perfect}</b><span>perfect days ⭐</span></div>
    <div class="stat"><b style="color:var(--gold)">${xp}</b><span>month XP</span></div></div>

    <tbody>${rows}</tbody>
    <tfoot><tr><td class="hn">✅ Done</td>${foot1}</tr><tr><td class="hn">⭐ Perfect</td>${foot2}</tr></tfoot></table></div>
  <div class="card"><h2>Daily completion</h2>
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" role="img" aria-label="Daily completion chart">
      <line x1="0" y1="10" x2="${W}" y2="10" stroke="var(--line)" stroke-dasharray="4 4"/>
      <path d="${path}" fill="color-mix(in srgb,var(--hp) 35%,transparent)" stroke="var(--hp)" stroke-width="2"/>
    </svg><div class="row muted" style="font-size:11px"><span>1</span><span class="sp"></span><span>${nd}</span></div></div>`;
}

function weightChart(c){
  const ws=c.ws; if(ws.length<2)return `<p class="sub">Log at least two weigh-ins to see your trend.</p>`;
  const W=520,H=200,P=28;
  const t0=fromKey(ws[0].k).getTime(), t1=fromKey(ws[ws.length-1].k).getTime(), span=Math.max(t1-t0,864e5);
  const vals=ws.map(p=>p.w); let lo=Math.min(...vals)-1, hi=Math.max(...vals)+1;
  const nextBoss=S.bosses.find(b=>c.lowest>b.target);
  if(nextBoss)lo=Math.min(lo,nextBoss.target-0.5);
  const x=k=>P+(fromKey(k).getTime()-t0)/span*(W-P-8), yv=v=>8+(hi-v)/(hi-lo)*(H-30);
  const dots=ws.map(p=>`<circle cx="${x(p.k).toFixed(1)}" cy="${yv(p.w).toFixed(1)}" r="3" fill="var(--muted)"/>`).join("");
  const avgPath=ws.map((p,i)=>`${i?"L":"M"}${x(p.k).toFixed(1)},${yv(avg7(p.k,ws)).toFixed(1)}`).join(" ");
  const ticks=[hi,(hi+lo)/2,lo].map(v=>`<text x="0" y="${yv(v)+4}" font-size="11" fill="var(--muted)">${v.toFixed(0)}</text>`).join("");
  const bossLine=nextBoss?`<line x1="${P}" x2="${W}" y1="${yv(nextBoss.target)}" y2="${yv(nextBoss.target)}" stroke="var(--ember)" stroke-dasharray="6 4"/><text x="${W-4}" y="${yv(nextBoss.target)-4}" text-anchor="end" font-size="11" fill="var(--ember)">${esc(nextBoss.ico)} ${nextBoss.target} kg</text>`:"";
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Weight trend chart">${ticks}${bossLine}${dots}
    <path d="${avgPath}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round"/></svg>
    <div class="row muted" style="font-size:12px;gap:14px"><span>● daily weight</span><span style="color:var(--accent)">━ 7-day average</span></div>`;
}

function viewJourney(c){
  const B=S.body, lost=B.start-c.latest, prog=Math.max(0,Math.min(1,(B.start-c.latest)/(B.start-B.goal)));
  let prevT=B.start;
  const bosses=S.bosses.map(b=>{const dead=c.lowest<=b.target;
    const hp=dead?0:Math.max(0,Math.min(1,(c.latestAvg-b.target)/(prevT-b.target)));
    const left=Math.max(0,c.latestAvg-b.target); prevT=b.target;
    return `<div class="boss ${dead?"dead":""}"><div class="ico">${esc(b.ico)}</div><div class="sp">
      <div class="bn">${esc(b.name)}</div><div class="muted" style="font-size:12px">${dead?"Defeated":`Beat it at a 7-day average of ${b.target} kg · ${fmt1(left)} kg to go`}</div>
      ${dead?"":`<div class="hpbar" aria-label="Boss health ${Math.round(hp*100)}%"><i style="width:${hp*100}%"></i></div>`}</div>
      <div class="rw">${dead?"✓ ":""}+${b.xp}</div></div>`}).join("");
  const waistKeys=Object.keys(S.days).filter(k=>typeof S.days[k].waist==="number").sort();
  const waistTxt=waistKeys.length?`${fmt1(S.days[waistKeys[waistKeys.length-1]].waist)} cm${waistKeys.length>1?` (${(S.days[waistKeys[waistKeys.length-1]].waist-S.days[waistKeys[0]].waist>=0?"+":"")}${fmt1(S.days[waistKeys[waistKeys.length-1]].waist-S.days[waistKeys[0]].waist)} cm)`:""}`:"Not logged yet";
  const lb=active().map(q=>{const s=streaks(q.id);return `<tr><td>${esc(q.name)}</td><td>${s.count}</td><td class="${s.cur>=7?"hot":""}">${s.cur}</td><td>${s.best}</td></tr>`}).join("");
  return `

  <div class="card">
    <div class="row"><div><div class="muted" style="font-size:12px">Latest weight</div><div class="big">${fmt1(c.latest)}</div></div>
      <div><div class="muted" style="font-size:12px">7-day avg</div><div class="big">${c.latestAvg.toFixed(1)}</div></div>
      <div class="sp"></div><div style="text-align:right"><div class="muted" style="font-size:12px">Lost so far</div><div class="big" style="color:var(--hp)">${lost>=0?"−":"+"}${fmt1(Math.abs(lost))}</div></div></div>
    <div class="journey" style="margin-top:12px" role="progressbar" aria-valuenow="${Math.round(prog*100)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${prog*100}%"></i></div>
    <div class="row muted" style="font-size:12px;margin-top:4px"><span>${B.start}</span><span class="sp" style="text-align:center">${(prog*100).toFixed(1)}% of the way</span><span>${B.goal}</span></div>
    <div class="row muted" style="font-size:13px;margin-top:10px;gap:16px"><span>BMI ${(c.latest/((B.height/100)**2)).toFixed(1)}</span><span>Waist ${waistTxt}</span></div>
  </div>
  <div class="card"><h2>Weight trend</h2>${weightChart(c)}</div>
  <h2 style="margin-top:18px">Boss battles</h2>
  <p class="sub">A boss falls when your 7-day average reaches its weight. One light morning can’t fake it, one heavy morning can’t undo it.</p>
  ${bosses}
  <div class="card"><h2>Quest leaderboard</h2>
    <table class="lb"><thead><tr><th>Quest</th><th>Done</th><th>Streak</th><th>Best</th></tr></thead><tbody>${lb}</tbody></table>
    <p class="sub" style="margin-top:8px">Streaks glow gold at 7 days.</p></div>
  <div class="card"><h2>Where your XP came from</h2>
    <table class="lb"><tbody>
      <tr><td>Daily quests and perfect days (${c.perfectDays} ⭐)</td><td>${c.questXP}</td></tr>
      <tr><td>Bosses defeated</td><td>${c.bossXP}</td></tr>
      <tr><td>Strength PRs</td><td>${c.prXP}</td></tr>
      <tr><td>Waist check-ins (${c.waistN})</td><td>${c.waistXP}</td></tr>
      <tr><td><b>Total</b></td><td><b>${c.total}</b></td></tr></tbody></table></div>`;
}

function render(){
  const c=calc();
  renderHud(c); renderTabs();
  const v=$("view");
  v.innerHTML=(tab==="today"?viewToday(c):tab==="month"?viewMonth():tab==="journey"?viewJourney(c):tab==="prs"?viewPRs(c):viewSetup())
    +`<div class="sync" id="sync">${esc(syncLabel)}</div>`;
  if(tab==="setup"){const t=$("theme");t.value=localStorage.getItem("flq-theme")||""}
  if(c.level>lastLevel){$("lvN").textContent=c.level;$("lvR").textContent=c.rank;$("lvlup").classList.add("show");$("lvOk").focus()}
  lastLevel=c.level;
}

function toggle(k,id){
  const r=rec(k); const i=r.done.indexOf(id);
  const before=dayInfo(k).perfect;
  if(i>=0)r.done.splice(i,1); else r.done.push(id);
  const q=S.quests.find(x=>x.id===id);
  if(i<0){const after=dayInfo(k).perfect; toast(after&&!before?`⭐ Perfect day! +${qxp(q)+S.rules.perfectBonus} XP`:`+${qxp(q)} XP`)}
  save(); render();
}
function setPath(path,val){
  const parts=path.split("."); let o=S; for(let i=0;i<parts.length-1;i++)o=o[parts[i]]; o[parts[parts.length-1]]=val;
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;history.replaceState(null,"","#"+tab);render();window.scrollTo(0,0);return}
  if(t.dataset.q){toggle(viewKey,t.dataset.q);return}
  if(t.dataset.cell){const [k,id]=t.dataset.cell.split("|");toggle(k,id);return}
  if(t.dataset.day!=null){const n=+t.dataset.day;viewKey=n===0?todayKey():keyOf(addDays(fromKey(viewKey),n));render();return}
  if(t.dataset.month){monthCursor.setMonth(monthCursor.getMonth()+ +t.dataset.month);render();return}
  if(t.dataset.qx){if(S.quests.length<=1)return;S.quests=S.quests.filter(q=>q.id!==t.dataset.qx);save();render();return}
  if(t.id==="addQ"){if(S.quests.length>=14){toast("14 quests max");return}S.quests.push({id:"q"+Date.now().toString(36),name:"✨ New quest",diff:"Easy"});save();render();return}
  if(t.id==="lvOk"){$("lvlup").classList.remove("show");return}
  if(t.id==="reset"){if(confirm("Reset all progress? Every tick, weigh-in and PR will be cleared.")){const keep={name:S.name,quests:S.quests,diffXP:S.diffXP,rules:S.rules,body:S.body,bosses:S.bosses,ranks:S.ranks};
    S=Object.assign(defaults(),keep,{days:{}});S.prs.forEach(p=>{p.kg=null;p.reps=null});lastLevel=1;save();render();toast("Progress cleared")}return}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="wIn"||t.id==="waistIn"){const r=rec(viewKey);const f=t.id==="wIn"?"w":"waist";const v=parseFloat(t.value);
    if(isNaN(v))delete r[f]; else {if(v<20||v>300){toast("That number looks off");return}r[f]=Math.round(v*10)/10;
      if(f==="w"){const wq=S.quests.find(q=>/weigh/i.test(q.name));if(wq&&!r.done.includes(wq.id))r.done.push(wq.id)}
      toast(f==="w"?"Weight saved":`Waist saved · +${S.rules.waistXP} XP`)}
    save();render();return}
  if(t.dataset.pr){const [id,f]=t.dataset.pr.split("|");const p=S.prs.find(x=>x.id===id);const was=prWon(p);const v=parseFloat(t.value);p[f]=isNaN(v)?null:v;
    if(!was&&prWon(p))toast(`🏆 New PR! +${S.rules.prXP} XP`);save();render();return}
  if(t.dataset.qn){const q=S.quests.find(x=>x.id===t.dataset.qn);q.name=t.value;save();render();return}
  if(t.dataset.qd){const q=S.quests.find(x=>x.id===t.dataset.qd);q.diff=t.value;save();render();return}
  if(t.dataset.set){if(t.dataset.set==="name")setPath("name",t.value.trim()||"Player");else{const v=parseFloat(t.value);if(isNaN(v)||v<=0){render();return}setPath(t.dataset.set,v)}save();render();return}
  if(t.id==="theme"){const v=t.value;try{v?localStorage.setItem("flq-theme",v):localStorage.removeItem("flq-theme")}catch(e){}applyTheme();return}
});
function applyTheme(){let v="";try{v=localStorage.getItem("flq-theme")||""}catch(e){} if(v)document.documentElement.setAttribute("data-theme",v);else document.documentElement.removeAttribute("data-theme")}
applyTheme();
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&tab==="today"&&viewKey!==todayKey()&&fromKey(viewKey)<new Date(new Date().toDateString())){} render()});
window.addEventListener("hashchange",()=>{const h=location.hash.replace("#","");if(["today","month","journey","prs","setup"].includes(h)){tab=h;render()}});
render();
})();
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
